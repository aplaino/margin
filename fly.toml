# The Margin api server on Fly.io. One machine on purpose: live presence is held in
# memory, so a second machine would split who can see whom.
app = "margin-api"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  MARGIN_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  # Public: it's shown to anyone during GitHub sign-in.
  GITHUB_CLIENT_ID = "Ov23lih46hAtRfO5kTd3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
